<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15695b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S.G. Crew">
<link rel="manifest" href="/crew.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>S.G. Cleaning — Crew</title>
<style>
  :root{--bg:#f4f6f5;--card:#fff;--ink:#22302e;--muted:#6c7b78;--teal:#15695b;--teal2:#1f8a78;
    --rush:#c8451f;--line:#e3e7e4;--shadow:0 2px 10px rgba(20,40,38,.08);--go:#1f8a4a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.45;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
  h1{font-size:25px;margin:.2em 0}h2{font-size:20px;margin:.6em 0 .3em}
  .muted{color:var(--muted)}
  .top{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-radius:0 0 22px 22px;
    padding:18px 18px 22px;margin:0 0 16px}
  .top h1{margin:0;color:#fff}.top .sub{color:rgba(255,255,255,.85);font-size:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 14px}
  .row{display:flex;align-items:center;gap:10px}.grow{flex:1}
  .time{font-size:24px;font-weight:800;color:var(--teal)}
  .name{font-size:20px;font-weight:700}.sub{color:var(--muted);font-size:16px}
  .chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
  .chip.sched{background:#eef3f1;color:var(--teal)}
  .chip.prog{background:#fff3d6;color:#8a6a13}
  .chip.done{background:#e3f3e8;color:#1f7a44}
  .drive{color:var(--teal);font-weight:600;font-size:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;
    border-radius:14px;border:none;cursor:pointer;font-size:18px;font-weight:700;background:var(--teal);color:#fff;width:100%;margin-top:10px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#eef3f1;color:var(--teal)}
  .btn.go{background:var(--go)}
  .btn.warn{background:#f3e7df;color:var(--rush)}
  .btn.half{width:calc(50% - 5px)}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  input{font-family:inherit;font-size:18px;width:100%;border:2px solid var(--line);border-radius:14px;padding:13px;background:#fff;margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:34px 10px}.empty .big{font-size:40px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22302e;color:#fff;padding:12px 18px;
    border-radius:14px;font-size:17px;box-shadow:var(--shadow);z-index:60;max-width:90%;text-align:center;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .overlay{position:fixed;inset:0;background:linear-gradient(160deg,#15695b,#1f8a78);z-index:80;display:flex;align-items:center;justify-content:center;padding:22px}
  .gate{background:#fff;border-radius:22px;padding:26px;max-width:380px;width:100%;box-shadow:var(--shadow)}
  .gate .big{font-size:44px;text-align:center}
  .gate h1{text-align:center;margin:.1em 0 .1em}
  .gate .sub{text-align:center;color:var(--muted);margin-bottom:8px}
  .link{display:block;text-align:center;color:var(--teal);font-size:16px;margin-top:14px;text-decoration:underline;cursor:pointer}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .pill{font-size:14px;color:var(--muted);margin-top:6px}
  .timer{margin-top:10px;text-align:center;font-weight:700;border-radius:12px;padding:11px;font-size:18px}
  .timer.live{background:#fff3d6;color:#8a6a13}
  .timer.done{background:#e3f3e8;color:#1f7a44}
  .timer .tval{font-variant-numeric:tabular-nums;font-size:21px}
  .sheet{position:fixed;inset:0;background:rgba(20,40,38,.5);z-index:70;display:none;align-items:flex-end}
  .sheet .inner{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:0 auto;padding:18px 18px 28px}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid #fff8;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="overlay" id="login">
  <div class="gate">
    <div class="big">🧹</div>
    <h1>S.G. Cleaning Crew</h1>
    <div class="sub" id="loginSub">Sign in to see your jobs.</div>
    <div id="loginForm">
      <input id="email" type="email" inputmode="email" placeholder="Your email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" onclick="doLogin()">Sign in</button>
      <span class="link" onclick="showSignup()">First time here? Set up my account</span>
      <span class="link" onclick="doForgot()">Forgot password</span>
    </div>
    <div id="signupForm" style="display:none">
      <input id="suName" placeholder="Your name">
      <input id="suEmail" type="email" inputmode="email" placeholder="Your email (the one Sue has)">
      <input id="suPassword" type="password" placeholder="Make a password (6+ characters)">
      <button class="btn" onclick="doSignup()">Create my account</button>
      <span class="link" onclick="showLogin()">← Back to sign in</span>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div class="row">
      <div class="grow"><h1 id="hi">Hi 👋</h1><div class="sub" id="dateLine"></div></div>
      <button class="btn ghost" style="width:auto;margin:0;min-height:44px" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="wrap" style="padding-top:0">
    <div class="card" id="locCard">
      <button class="btn ghost" onclick="planFromHere()">📍 Plan from where I am now</button>
      <div id="locResult"></div>
    </div>
    <h2 id="todayHdr">Today's jobs</h2>
    <div id="todayList"></div>
    <h2>Coming up</h2>
    <div id="upList"></div>
    <div class="card" style="margin-top:8px"><button class="btn ghost" onclick="subscribeCal()">📅 Add my schedule to my calendar</button></div>
  </div>
</div>

<!-- MESSAGE CLIENT SHEET -->
<div class="sheet" id="msgSheet"><div class="inner">
  <div class="row"><h2 class="grow" style="margin:0" id="msgTitle">Message client</h2><button class="btn ghost" style="width:auto;margin:0;min-height:40px" onclick="document.getElementById('msgSheet').style.display='none'">✕</button></div>
  <div class="btns" style="margin:6px 0">
    <button class="btn half ghost" onclick="quickMsg('I\'m running about 15 minutes late — be there soon!')">⏰ Running ~15 late</button>
    <button class="btn half ghost" onclick="quickMsg('Quick question about today\'s cleaning — could you call or text me?')">❓ I have a question</button>
  </div>
  <div id="thread" style="max-height:42vh;overflow:auto;margin:8px 0"></div>
  <textarea id="msgText" placeholder="Type a message to the client…" style="min-height:60px"></textarea>
  <button class="btn" onclick="sendCrewMsg()">Send</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
const SESS='sgc_crew';
let DATA={today:[],upcoming:[]};

async function api(action,params){
  if(window.__MOCK__){ const v=window.__MOCK__[action]; return (v!==undefined)? JSON.parse(JSON.stringify(v)) : {ok:true}; }
  const res=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({action,session:localStorage.getItem(SESS)||''},params||{}))});
  if(res.status===401){ showLogin(); document.getElementById('login').style.display='flex'; throw new Error('auth'); }
  const j=await res.json(); if(!j.ok) throw new Error(j.error||'error'); return j.data;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---- auth ---- */
function showLogin(){document.getElementById('loginForm').style.display='block';document.getElementById('signupForm').style.display='none';document.getElementById('loginSub').textContent='Sign in to see your jobs.';}
function showSignup(){document.getElementById('loginForm').style.display='none';document.getElementById('signupForm').style.display='block';document.getElementById('loginSub').textContent='Set up your account (one time).';}
async function doLogin(){
  const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
  if(!email||!password){toast('Enter your email and password.');return;}
  try{
    const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'employee',email,password})});
    const j=await res.json();
    if(j.ok){ localStorage.setItem(SESS,j.token); enter(j.name); } else toast(j.error||'Sign-in failed.');
  }catch(e){toast('Could not connect.');}
}
async function doSignup(){
  const name=document.getElementById('suName').value.trim(),email=document.getElementById('suEmail').value.trim(),password=document.getElementById('suPassword').value;
  if(!email||!password){toast('Fill in all the boxes.');return;}
  try{
    const res=await fetch('/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'employee',name,email,password})});
    const j=await res.json();
    if(j.ok){ localStorage.setItem(SESS,j.token); enter(j.name); } else toast(j.error||'Could not set up account.');
  }catch(e){toast('Could not connect.');}
}
async function doForgot(){
  const email=document.getElementById('email').value.trim();
  if(!email){toast('Type your email first, then tap Forgot.');return;}
  await fetch('/auth/reset-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'employee',email})});
  toast('If that email is set up, a reset link is on the way.');
}
function signOut(){ localStorage.removeItem(SESS); location.reload(); }
function enter(name){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hi').textContent='Hi'+(name?', '+name.split(' ')[0]:'')+' 👋';
  document.getElementById('dateLine').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  boot();
}

/* ---- data ---- */
function boot(){ api('crew_home').then(d=>{ DATA=d; render(); }).catch(()=>{}); }
function render(){
  const t=document.getElementById('todayList');
  document.getElementById('todayHdr').textContent="Today's jobs ("+DATA.today.length+")";
  t.innerHTML=DATA.today.length?DATA.today.map(jobCard).join(''):'<div class="empty"><div class="big">☀️</div>No jobs assigned for today.</div>';
  const u=document.getElementById('upList');
  u.innerHTML=DATA.upcoming.length?DATA.upcoming.map(upCard).join(''):'<div class="empty">Nothing coming up yet.</div>';
  tickTimers();
}
function statusChip(s){
  if(s==='in_progress')return '<span class="chip prog">In progress</span>';
  if(s==='done')return '<span class="chip done">✓ Done</span>';
  return '<span class="chip sched">Scheduled</span>';
}
function jobCard(j){
  const photos=(j.before.concat(j.after)).slice(0,4).map(u=>'<img src="'+esc(u)+'">').join('');
  const drive=(j.driveMins!==''&&j.driveMins!=null)?'<div class="drive">🚗 about '+esc(j.driveMins)+' min '+esc(j.fromLabel||'')+'</div>':'';
  let actions='';
  if(j.status==='done'){
    const dur=j.durationMins?fmtDur(j.durationMins):'';
    actions='<div class="timer done">✅ Finished'+(dur?' · '+dur:'')+(j.startedLabel?' · '+esc(j.startedLabel)+'–'+esc(j.finishedLabel||''):'')+'</div>';
  } else if(j.status==='in_progress'){
    actions='<div class="timer live" data-start="'+esc(j.startedAt||'')+'">⏱ <span class="tval">…</span> on the job</div>'
      +'<button class="btn go" onclick="clock(\''+j.id+'\',\'done\')">✅ I\'m finished</button>';
  } else {
    actions='<button class="btn go" onclick="clock(\''+j.id+'\',\'in_progress\')">▶️ I\'m here — start the timer</button>';
  }
  return '<div class="card">'
    +'<div class="row"><div class="time">'+esc(j.timeLabel||'')+'</div><div class="grow"></div>'+statusChip(j.status)+'</div>'
    +'<div class="name" style="margin-top:6px">'+esc(j.title||'Cleaning')+'</div>'
    +(j.address?'<div class="sub">📍 '+esc(j.address)+'</div>':'')+drive
    +(photos?'<div class="photos">'+photos+'</div>':'')
    +'<div class="btns">'
    +(j.address?'<button class="btn half" onclick="directions(\''+j.id+'\')">🧭 Directions</button>':'')
    +'<button class="btn half warn" onclick="late(\''+j.id+'\')">⏰ Running late</button>'
    +'<button class="btn half ghost" onclick="msgClient(\''+j.id+'\')">💬 Message</button>'
    +'<button class="btn half ghost" onclick="photo(\''+j.id+'\',\'before\')">📷 Before</button>'
    +'<button class="btn half ghost" onclick="photo(\''+j.id+'\',\'after\')">📸 After</button>'
    +'</div>'+actions+'</div>';
}
function fmtDur(m){ m=Number(m)||0; const h=Math.floor(m/60),mm=m%60; return h?(h+'h '+mm+'m'):(mm+'m'); }
/* GPS-stamped clock in/out, then refresh */
function clock(id,status){
  const label=status==='in_progress'?'Starting the timer…':'Saving your time…';
  toast(label);
  navigator.geolocation?navigator.geolocation.getCurrentPosition(
    pos=>doClock(id,status,pos.coords.latitude,pos.coords.longitude),
    ()=>doClock(id,status,null,null),{enableHighAccuracy:true,timeout:8000}
  ):doClock(id,status,null,null);
}
function doClock(id,status,lat,lng){
  api('crew_update',{jobId:id,status,lat,lng}).then(r=>{
    if(status==='in_progress'){ toast(r.onSite==='no'?'Started (note: you don\'t look on-site yet).':'Timer started! ⏱'); }
    else { toast('Saved'+(r.durationMins?' · '+fmtDur(r.durationMins):'')+'. Nice work! 💛'); }
    boot();
  }).catch(()=>toast('Couldn\'t save — try again.'));
}
/* live ticking timer for in-progress jobs */
function tickTimers(){
  document.querySelectorAll('.timer.live').forEach(el=>{
    const s=el.getAttribute('data-start'); if(!s)return;
    const secs=Math.max(0,Math.floor((Date.now()-new Date(s).getTime())/1000));
    const h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),ss=secs%60;
    el.querySelector('.tval').textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  });
}
setInterval(tickTimers,1000);
function upCard(j){
  return '<div class="card"><div class="row"><div class="grow"><div class="name">'+esc(j.dayLabel)+' · '+esc(j.timeLabel)+'</div>'
    +'<div class="sub">'+esc(j.title||'Cleaning')+(j.address?' · 📍 '+esc(j.address):'')+'</div></div>'+statusChip(j.status)+'</div>'
    +(j.address?'<button class="btn ghost" onclick="directions(\''+j.id+'\')">🧭 Directions</button>':'')+'</div>';
}
function jobById(id){ return DATA.today.concat(DATA.upcoming).filter(j=>j.id===id)[0]; }
function directions(id){ const j=jobById(id); if(j&&j.address) window.open('http://maps.apple.com/?daddr='+encodeURIComponent(j.address),'_blank'); }
function setStatus(id,s){ toast(s==='done'?'Marking finished…':'Starting…'); api('crew_update',{jobId:id,status:s}).then(()=>boot()); }
function late(id){ toast('Texting the client…'); api('crew_action',{jobId:id,kind:'running_late',arg:20}).then(r=>toast(r.ok?'Sent — they know you\'re coming. 💛':(r.error||'Couldn\'t send'))); }
function photo(jobId,kind){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;resize(f,d=>{toast('Saving photo…');api('crew_action',{jobId,kind:'photo',arg:d,arg2:kind}).then(r=>{toast(r.ok?'Photo saved! 📷':'Couldn\'t save');if(r.ok)boot();});});};
  inp.click();
}
function resize(file,cb){const img=new Image(),rd=new FileReader();rd.onload=()=>{img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82));};img.src=rd.result;};rd.readAsDataURL(file);}
function planFromHere(){
  if(!navigator.geolocation){toast('Location not available.');return;}
  document.getElementById('locResult').innerHTML='<div class="pill">Finding you… <span class="spin" style="border-color:#cdd;border-top-color:#15695b"></span></div>';
  navigator.geolocation.getCurrentPosition(pos=>{
    api('crew_action',{kind:'eta'}); // noop placeholder; live ETA uses next job below
    const next=DATA.today.find(j=>j.status!=='done')||DATA.upcoming[0];
    const el=document.getElementById('locResult');
    if(!next){el.innerHTML='<div class="pill">No job to route to.</div>';return;}
    el.innerHTML='<div class="card" style="margin:10px 0 0;background:#eef7f4"><div class="name">Next: '+esc(next.title||'Cleaning')+'</div>'
      +'<div class="sub">📍 '+esc(next.address||'')+'</div>'
      +'<div class="btns"><button class="btn half" onclick="directions(\''+next.id+'\')">🧭 Directions</button>'
      +'<button class="btn half ghost" onclick="shareEta(\''+next.id+'\','+pos.coords.latitude+','+pos.coords.longitude+')">📨 Tell client I\'m coming</button></div></div>';
  },()=>{document.getElementById('locResult').innerHTML='<div class="pill">Location was blocked.</div>';},{enableHighAccuracy:true,timeout:10000});
}
function shareEta(id,lat,lng){ toast('Letting them know…'); api('crew_action',{jobId:id,kind:'eta',arg:15,arg2:lat,arg3:lng}).then(r=>toast(r.ok?'Sent! 🚗':(r.error||'Couldn\'t send'))); }

/* message the client */
let MSG_JOB='';
function msgClient(jobId){ MSG_JOB=jobId; document.getElementById('thread').innerHTML='<div class="pill" style="text-align:center">Loading…</div>';
  document.getElementById('msgSheet').style.display='flex';
  api('crew_convo',{jobId}).then(r=>renderCrewThread(r.messages||[])).catch(()=>renderCrewThread([])); }
function renderCrewThread(msgs){
  const el=document.getElementById('thread');
  el.innerHTML=msgs.length?msgs.map(m=>{const mine=m.fromRole==='employee';
    return '<div style="display:flex;justify-content:'+(mine?'flex-end':'flex-start')+';margin:6px 0"><div style="max-width:80%;background:'+(mine?'#15695b;color:#fff':'#eef3f1;color:#22302e')+';padding:9px 13px;border-radius:14px"><div style="font-size:12px;opacity:.7">'+esc(mine?'You':(m.fromName||'Client'))+' · '+esc(m.timeLabel||'')+'</div>'+esc(m.text)+'</div></div>';
  }).join(''):'<div class="pill" style="text-align:center">No messages yet.</div>';
  el.scrollTop=el.scrollHeight;
}
function quickMsg(t){ document.getElementById('msgText').value=t; }
function sendCrewMsg(){
  const text=document.getElementById('msgText').value.trim(); if(!text){toast('Type a message first.');return;}
  document.getElementById('msgText').value='';
  api('crew_message_client',{jobId:MSG_JOB,text}).then(r=>{ if(r.ok){toast('Sent to the client! 💬');api('crew_convo',{jobId:MSG_JOB}).then(rr=>renderCrewThread(rr.messages||[]));}else toast(r.error||'Could not send'); });
}

/* calendar subscribe */
function subscribeCal(){
  toast('Setting up your calendar…');
  api('feed_token').then(r=>{ if(!r.token){toast('Try again in a moment.');return;}
    window.open('webcal://'+location.host+'/calendar/employee/'+r.token+'.ics','_blank');
    toast('Pick "Subscribe" when your calendar opens. 📅');
  }).catch(()=>toast('Could not set up calendar.'));
}

/* ---- start ---- */
if(window.__MOCK__){ enter(window.__MOCK__.__name||'Maria'); }
else if(localStorage.getItem(SESS)){ enter(''); }
else { document.getElementById('login').style.display='flex'; }
</script>
</body>
</html>
